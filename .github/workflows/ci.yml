name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: Application (types, lint, tests, build, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Aucun secret dans le dépôt ni dans le build
        run: npm run check:secrets
      - run: npm audit --audit-level=high --omit=dev

  database:
    name: Base de données (migrations + tests RLS / sécurité)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + tests de sécurité multi-tenant
        env:
          # Base jetable du job CI (aucune donnée réelle).
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: ./scripts/test-db.sh
