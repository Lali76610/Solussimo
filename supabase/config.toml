# Configuration Supabase CLI (développement local : `supabase start`).
# Ne contient AUCUN secret. Les clés sont fournies par l'environnement.
project_id = "solussimo"

[api]
enabled = true
port = 54321
# Seuls ces schémas sont exposés par l'API REST. « private » ne l'est jamais.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "https://solussimo-demo.netlify.app/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m0s"
